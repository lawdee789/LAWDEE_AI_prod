[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawyer-matching-service"
version = "0.1.0"
description = "Semantic matching microservice that pairs Thai legal cases to lawyers."
authors = [{name = "LawProject", email = "dev@lawproject.example"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.23,<1.0",
    "sentence-transformers>=2.2,<3.0",
    "numpy>=1.24,<2.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0"
]
readme = "ReadMe"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.28",
    "pytest>=7.4,<8.0"
]

[tool.uvicorn]
factory = false
reload = true
port = 8000
host = "0.0.0.0"
log_level = "info"

